name: MachineLib Forge 1.20.1 CI

on:
  workflow_dispatch:
  push:
    branches:
      - galacticraft-1.20.1-forge-port
    paths:
      - '.github/workflows/machinelib-forge.yml'
      - 'projects/machinelib/**'

jobs:
  build:
    name: Build MachineLib Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revival repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and build MachineLib Forge backport
        working-directory: projects/machinelib/forge-backport
        run: gradle clean build --stacktrace

      - name: Verify Forge machine runtime was packaged
        working-directory: projects/machinelib/forge-backport
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'MachineLib-Forge-1.20.1-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          for CLASS in \
            dev/galacticraft/machinelib/impl/storage/MachineEnergyStorageImpl.class \
            dev/galacticraft/machinelib/forge/energy/ForgeEnergyStorageAdapter.class \
            dev/galacticraft/machinelib/api/storage/slot/ItemResourceSlot.class \
            dev/galacticraft/machinelib/api/storage/slot/FluidResourceSlot.class \
            dev/galacticraft/machinelib/api/storage/slot/SlotGroup.class \
            dev/galacticraft/machinelib/api/storage/slot/SlotGroupType.class \
            dev/galacticraft/machinelib/impl/storage/MachineItemStorageImpl.class \
            dev/galacticraft/machinelib/impl/storage/MachineFluidStorageImpl.class \
            dev/galacticraft/machinelib/api/machine/MachineType.class \
            dev/galacticraft/machinelib/api/block/entity/MachineBlockEntity.class \
            dev/galacticraft/machinelib/forge/item/ForgeItemStorageAdapter.class \
            dev/galacticraft/machinelib/forge/fluid/ForgeFluidStorageAdapter.class \
            dev/galacticraft/machinelib/forge/capability/ForgeMachineCapabilityBridge.class
          do
            jar tf "$JAR" | grep -F "$CLASS"
          done
          echo "Validated: $JAR"

      - name: Upload MachineLib Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: MachineLib-Forge-1.20.1-machine-runtime
          path: projects/machinelib/forge-backport/build/libs/*.jar
          if-no-files-found: error
