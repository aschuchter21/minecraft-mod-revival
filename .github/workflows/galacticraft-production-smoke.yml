name: Galacticraft Production Jar Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - galacticraft-1.20.1-forge-port
    paths:
      - '.github/workflows/galacticraft-production-smoke.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: galacticraft-production-jar-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-jar-smoke:
    name: Boot uploaded jars on Forge 47.4.10
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find latest experimental runtime artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=Galacticraft-Forge-1.20.1-experimental-runtime&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "galacticraft-1.20.1-forge-port")] | sort_by(.created_at) | last')
          test "$ARTIFACT" != "null"
          ARTIFACT_ID=$(jq -r '.id' <<<"$ARTIFACT")
          ARTIFACT_RUN=$(jq -r '.workflow_run.id' <<<"$ARTIFACT")
          ARTIFACT_SHA=$(jq -r '.workflow_run.head_sha' <<<"$ARTIFACT")
          echo "Using artifact $ARTIFACT_ID from run $ARTIFACT_RUN / $ARTIFACT_SHA"
          echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "run=$ARTIFACT_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$ARTIFACT_SHA" >> "$GITHUB_OUTPUT"

      - name: Download experimental Galacticraft and MachineLib jars
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime.zip
          mkdir runtime-artifact
          unzip -q runtime.zip -d runtime-artifact
          echo '--- Downloaded jar payload ---'
          find runtime-artifact -type f -name '*.jar' -printf '%p\n' | sort

          GC_JAR=$(find runtime-artifact -type f -name 'Galacticraft-Forge-1.20.1-*.jar' ! -name '*-sources.jar' | head -n 1)
          ML_JAR=$(find runtime-artifact -type f -name 'MachineLib-Forge-1.20.1-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -s "$GC_JAR"
          test -s "$ML_JAR"
          printf '%s\n' "$GC_JAR" > gc-jar-path.txt
          printf '%s\n' "$ML_JAR" > ml-jar-path.txt

      - name: Diagnose production jar namespace
        run: |
          set -euo pipefail
          GC_JAR=$(cat gc-jar-path.txt)

          echo '--- Galacticraft production jar SHA256 ---'
          sha256sum "$GC_JAR"

          echo '--- Bootstrap constant-pool Minecraft class references ---'
          javap -classpath "$GC_JAR" -verbose dev.galacticraft.forge.GalacticraftForgeBootstrap \
            | grep -E 'net/minecraft|net/minecraftforge' \
            | head -n 120 || true

          echo '--- BuiltinObjects constant-pool Minecraft class references ---'
          javap -classpath "$GC_JAR" -verbose dev.galacticraft.impl.universe.BuiltinObjects \
            | grep -E 'net/minecraft|net/minecraftforge' \
            | head -n 120 || true

          echo '--- GCBlocks constant-pool block/property references ---'
          javap -classpath "$GC_JAR" -verbose dev.galacticraft.mod.content.GCBlocks \
            | grep -E 'BlockBehaviour|StairBlock|net/minecraft/world/level/block' \
            | head -n 160 || true

          echo '--- Access transformer embedded in production jar ---'
          unzip -p "$GC_JAR" META-INF/accesstransformer.cfg || true

      - name: Install Forge 47.4.10 server
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output forge-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          mkdir server
          (
            cd server
            java -jar ../forge-installer.jar --installServer
          )
          test -f server/run.sh
          chmod +x server/run.sh

          echo '--- Installed production Minecraft/Forge jars ---'
          find server/libraries -type f \( -name '*1.20.1*.jar' -o -name '*47.4.10*.jar' \) -printf '%p\n' | sort | head -n 100

          echo '--- Does the installed production runtime expose named BlockBehaviour? ---'
          FOUND_NAMED=0
          while IFS= read -r jar; do
            if jar tf "$jar" 2>/dev/null | grep -Fqx 'net/minecraft/world/level/block/state/BlockBehaviour$Properties.class'; then
              echo "FOUND in $jar"
              FOUND_NAMED=1
            fi
          done < <(find server/libraries -type f -name '*.jar' -print)
          echo "named_blockbehaviour_properties_found=$FOUND_NAMED"

      - name: Install experimental mods
        run: |
          set -euo pipefail
          GC_JAR=$(cat gc-jar-path.txt)
          ML_JAR=$(cat ml-jar-path.txt)
          mkdir -p server/mods
          cp "$GC_JAR" server/mods/
          cp "$ML_JAR" server/mods/
          printf 'eula=true\n' > server/eula.txt
          echo '--- Production mods directory ---'
          find server/mods -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Smoke boot production Forge server
        run: |
          set -euo pipefail
          set +e
          (
            cd server
            timeout 150s ./run.sh nogui > production-server.log 2>&1
          )
          STATUS=$?
          set -e

          if grep -Fq 'Done (' server/production-server.log; then
            echo 'Production Forge server reached the running-server state.'
            tail -n 150 server/production-server.log
            exit 0
          fi

          echo "Production Forge server did not reach the running-server state (exit $STATUS)." >&2
          tail -n 300 server/production-server.log >&2
          exit 1

      - name: Upload production smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-Forge-1.20.1-production-smoke-log
          path: server/production-server.log
          if-no-files-found: warn
