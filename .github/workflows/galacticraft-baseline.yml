name: Galacticraft Port CI

on:
  workflow_dispatch:
  push:
    branches:
      - galacticraft-1.20.1-forge-port
    paths:
      - '.github/workflows/galacticraft-baseline.yml'
      - 'projects/galacticraft/**'
      - 'projects/machinelib/**'

concurrency:
  group: galacticraft-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-1_20_1-skeleton:
    name: Forge 47.4.10 port skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revival repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Forge skeleton
        working-directory: projects/galacticraft/forge-skeleton
        run: gradle build --stacktrace

      - name: Upload Forge skeleton
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-Forge-1.20.1-skeleton
          path: projects/galacticraft/forge-skeleton/build/libs/*.jar
          if-no-files-found: error

  dynamicdimensions-forge-1_20_1:
    name: Recover DynamicDimensions Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DynamicDimensions 1.20 source
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/DynamicDimensions
          ref: minecraft/1.20
          path: DynamicDimensions

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Target Forge 47.4.10
        working-directory: DynamicDimensions
        run: sed -i 's/^forge.version=.*/forge.version=47.4.10/' gradle.properties

      - name: Build Forge DynamicDimensions
        working-directory: DynamicDimensions
        env:
          PRE_RELEASE: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :Forge:build --stacktrace

      - name: Upload Forge DynamicDimensions
        uses: actions/upload-artifact@v4
        with:
          name: DynamicDimensions-Forge-1.20.1
          path: DynamicDimensions/Forge/build/libs/*.jar
          if-no-files-found: error

  recovered-official-1_20_1-fabric:
    name: Recover official GC5 1.20.1 baseline + validate Forge overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revival port repository
        uses: actions/checkout@v4
        with:
          path: Revival

      - name: Checkout Galacticraft 1.20.1 MachineLib 0.3 baseline
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/Galacticraft
          ref: minecraft/1.20.1+machinelib-0.3
          path: Galacticraft

      - name: Checkout exact MachineLib 0.3 dependency
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/MachineLib
          ref: 031a62640ce753e0c6a5eb4e8ee6d495fecb2ecf
          path: MachineLib

      - name: Checkout DynamicDimensions 1.20 source
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/DynamicDimensions
          ref: minecraft/1.20
          path: DynamicDimensions

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13 for Forge validation
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build exact MachineLib dependency
        working-directory: MachineLib
        run: |
          chmod +x gradlew
          ./gradlew remapJar --stacktrace
          echo '--- MachineLib jars ---'
          find build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build DynamicDimensions Fabric dependency
        working-directory: DynamicDimensions
        env:
          PRE_RELEASE: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :Fabric:remapJar --stacktrace
          echo '--- DynamicDimensions Fabric jars ---'
          find Fabric/build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish recovered dependencies to isolated local Maven
        working-directory: Galacticraft
        run: |
          MACHINE_JAR=$(find ../MachineLib/build/libs -maxdepth 1 -type f -name 'MachineLib-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | head -n 1)
          DD_JAR=$(find ../DynamicDimensions/Fabric/build/libs -maxdepth 1 -type f -name 'dynamicdimensions-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | head -n 1)

          test -n "$MACHINE_JAR"
          test -n "$DD_JAR"

          MACHINE_VERSION=$(basename "$MACHINE_JAR" .jar | sed 's/^MachineLib-//')
          DD_VERSION=$(basename "$DD_JAR" .jar | sed 's/^dynamicdimensions-fabric-//')

          echo "Recovered MachineLib: $MACHINE_JAR -> $MACHINE_VERSION"
          echo "Recovered DynamicDimensions: $DD_JAR -> $DD_VERSION"

          LOCAL_MAVEN=../RecoveredMaven/dev/galacticraft
          MACHINE_DIR="$LOCAL_MAVEN/MachineLib/$MACHINE_VERSION"
          DD_DIR="$LOCAL_MAVEN/dynamicdimensions-fabric/$DD_VERSION"
          mkdir -p "$MACHINE_DIR" "$DD_DIR"

          cp "$MACHINE_JAR" "$MACHINE_DIR/MachineLib-$MACHINE_VERSION.jar"
          cp "$DD_JAR" "$DD_DIR/dynamicdimensions-fabric-$DD_VERSION.jar"

          cat > "$MACHINE_DIR/MachineLib-$MACHINE_VERSION.pom" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.galacticraft</groupId>
            <artifactId>MachineLib</artifactId>
            <version>$MACHINE_VERSION</version>
          </project>
          EOF

          cat > "$DD_DIR/dynamicdimensions-fabric-$DD_VERSION.pom" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.galacticraft</groupId>
            <artifactId>dynamicdimensions-fabric</artifactId>
            <version>$DD_VERSION</version>
          </project>
          EOF

          sed -i "s/^machinelib.version=.*/machinelib.version=${MACHINE_VERSION}/" gradle.properties
          sed -i "s/^dynamicdimensions.version=.*/dynamicdimensions.version=${DD_VERSION}/" gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle.kts')
          s = p.read_text()

          marker = 'repositories {'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('Could not find repositories block')
          insert_at = idx + len(marker)
          recovered = '''
              exclusiveContent {
                  forRepository {
                      maven {
                          name = "Recovered Galacticraft Dependencies"
                          url = uri("../RecoveredMaven")
                      }
                  }
                  filter {
                      includeGroup("dev.galacticraft")
                  }
              }
          '''
          s = s[:insert_at] + recovered + s[insert_at:]

          dep_marker = 'dependencies {'
          dep_idx = s.find(dep_marker)
          if dep_idx < 0:
              raise SystemExit('Could not find dependencies block')
          dep_insert = dep_idx + len(dep_marker)
          energy_dep = '''
              modImplementation("teamreborn:energy:3.0.0") {
                  isTransitive = false
              }
          '''
          s = s[:dep_insert] + energy_dep + s[dep_insert:]
          p.write_text(s)
          PY

          echo '--- Effective recovered dependency versions ---'
          grep -E '^(dynamicdimensions|machinelib)\.version=' gradle.properties
          echo '--- Isolated local Maven contents ---'
          find ../RecoveredMaven -type f -printf '%P\n' | sort
          echo '--- Recovered Maven repository block ---'
          grep -n -A12 'Recovered Galacticraft Dependencies' build.gradle.kts

      - name: Compile recovered official Galacticraft 1.20.1
        working-directory: Galacticraft
        run: |
          chmod +x gradlew
          ./gradlew clean compileJava remapJar --stacktrace
          echo '--- Galacticraft output jars ---'
          find build/libs -type f -name '*.jar' -printf '%p\n' | sort

      - name: Build official-class support jar
        run: |
          jar --create --file gc-1.20.1-support.jar -C Galacticraft/build/classes/java/main .
          test -s gc-1.20.1-support.jar
          echo "Support jar size: $(stat -c%s gc-1.20.1-support.jar) bytes"

      - name: Build Forge MachineLib compatibility runtime
        working-directory: Revival/projects/machinelib/forge-backport
        run: |
          gradle clean build --stacktrace
          jar --create --file build/libs/MachineLib-Forge-1.20.1-dev.jar -C build/classes/java/main .
          test -s build/libs/MachineLib-Forge-1.20.1-dev.jar
          echo '--- Forge MachineLib jars ---'
          find build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate Forge overlays
        run: |
          rm -rf ForgeEnergyValidation
          cp -R Revival/projects/galacticraft/forge-skeleton ForgeEnergyValidation
          mkdir -p ForgeEnergyValidation/libs
          cp gc-1.20.1-support.jar ForgeEnergyValidation/libs/
          MACHINE_FORGE_DEV_JAR=Revival/projects/machinelib/forge-backport/build/libs/MachineLib-Forge-1.20.1-dev.jar
          test -s "$MACHINE_FORGE_DEV_JAR"
          cp "$MACHINE_FORGE_DEV_JAR" ForgeEnergyValidation/libs/machinelib-forge-dev.jar
          cp -R Revival/projects/galacticraft/forge-overlays/src/main/java/. ForgeEnergyValidation/src/main/java/
          cat >> ForgeEnergyValidation/build.gradle <<'EOF'

          dependencies {
              compileOnly files('libs/gc-1.20.1-support.jar', 'libs/machinelib-forge-dev.jar')
          }
          EOF
          echo '--- Forge overlay Java sources ---'
          find ForgeEnergyValidation/src/main/java -type f -name '*.java' -printf '%P\n' | sort
          echo '--- Forge validation libraries ---'
          find ForgeEnergyValidation/libs -maxdepth 1 -type f -printf '%f\n' | sort
          gradle -p ForgeEnergyValidation clean compileJava --stacktrace

      - name: Assemble experimental Forge runtime
        run: |
          chmod +x Revival/projects/galacticraft/ci/assemble-runtime.sh
          Revival/projects/galacticraft/ci/assemble-runtime.sh \
            Revival Galacticraft gc-1.20.1-support.jar ForgeRuntimeValidation

      - name: Upload experimental Forge runtime
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-Forge-1.20.1-experimental-runtime
          path: |
            ForgeRuntimeValidation/build/libs/Galacticraft-Forge-1.20.1-*.jar
            !ForgeRuntimeValidation/build/libs/*-sources.jar
            Revival/projects/machinelib/forge-backport/build/libs/MachineLib-Forge-1.20.1-*.jar
            !Revival/projects/machinelib/forge-backport/build/libs/*-sources.jar
            !Revival/projects/machinelib/forge-backport/build/libs/*-dev.jar
          if-no-files-found: error

      - name: Smoke boot Forge dedicated server
        run: |
          chmod +x Revival/projects/galacticraft/ci/smoke-server.sh
          Revival/projects/galacticraft/ci/smoke-server.sh ForgeRuntimeValidation

      - name: Upload Forge server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-Forge-1.20.1-server-smoke-log
          path: ForgeRuntimeValidation/server-smoke.log
          if-no-files-found: warn

      - name: Inventory remaining Fabric and MachineLib boundaries
        if: always()
        run: |
          {
            echo '=== Fabric imports by top-level API ==='
            grep -RhoE '^import net\.fabricmc\.[^;]+' Galacticraft/src/main/java \
              | sed -E 's/^import (net\.fabricmc\.[^.]+\.[^.]+).*/\1/' \
              | sort | uniq -c | sort -nr || true
            echo
            echo '=== Reborn Energy imports ==='
            grep -RhnE '^import team\.reborn\.energy\.' Galacticraft/src/main/java || true
            echo
            echo '=== MachineLib imports ==='
            grep -RhnE '^import dev\.galacticraft\.machinelib\.' Galacticraft/src/main/java || true
            echo
            echo '=== Fabric files remaining after the Forge overlay slice ==='
            grep -RlE '^import (net\.fabricmc\.|team\.reborn\.energy\.)' Galacticraft/src/main/java \
              | sed 's#^Galacticraft/src/main/java/##' | sort || true
          } | tee port-boundaries.txt

      - name: Upload port boundary inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-1.20.1-port-boundaries
          path: port-boundaries.txt
          if-no-files-found: error

      - name: Upload recovered Fabric baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-5-1.20.1-recovered-fabric-baseline
          path: Galacticraft/build/libs/**/*.jar
          if-no-files-found: error
