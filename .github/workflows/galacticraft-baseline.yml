name: Galacticraft Port CI

on:
  workflow_dispatch:
  push:
    branches:
      - galacticraft-1.20.1-forge-port
    paths:
      - '.github/workflows/galacticraft-baseline.yml'
      - 'projects/galacticraft/**'

jobs:
  forge-1_20_1-skeleton:
    name: Forge 47.4.10 port skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revival repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Forge skeleton
        working-directory: projects/galacticraft/forge-skeleton
        run: gradle build --stacktrace

      - name: Upload Forge skeleton
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-Forge-1.20.1-skeleton
          path: projects/galacticraft/forge-skeleton/build/libs/*.jar
          if-no-files-found: error

  dynamicdimensions-forge-1_20_1:
    name: Recover DynamicDimensions Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DynamicDimensions 1.20 source
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/DynamicDimensions
          ref: minecraft/1.20
          path: DynamicDimensions

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Target Forge 47.4.10
        working-directory: DynamicDimensions
        run: sed -i 's/^forge.version=.*/forge.version=47.4.10/' gradle.properties

      - name: Build Forge DynamicDimensions
        working-directory: DynamicDimensions
        env:
          PRE_RELEASE: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :Forge:build --stacktrace

      - name: Upload Forge DynamicDimensions
        uses: actions/upload-artifact@v4
        with:
          name: DynamicDimensions-Forge-1.20.1
          path: DynamicDimensions/Forge/build/libs/*.jar
          if-no-files-found: error

  recovered-official-1_20_1-fabric:
    name: Recover official GC5 1.20.1 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Galacticraft 1.20.1 MachineLib 0.3 baseline
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/Galacticraft
          ref: minecraft/1.20.1+machinelib-0.3
          path: Galacticraft

      - name: Checkout exact MachineLib 0.3 dependency
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/MachineLib
          ref: 031a62640ce753e0c6a5eb4e8ee6d495fecb2ecf
          path: MachineLib

      - name: Checkout DynamicDimensions 1.20 source
        uses: actions/checkout@v4
        with:
          repository: TeamGalacticraft/DynamicDimensions
          ref: minecraft/1.20
          path: DynamicDimensions

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build exact MachineLib dependency
        working-directory: MachineLib
        env:
          GITHUB_SHA: 031a62640ce753e0c6a5eb4e8ee6d495fecb2ecf
        run: |
          chmod +x gradlew
          ./gradlew remapJar --stacktrace
          echo '--- MachineLib jars ---'
          find build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build DynamicDimensions Fabric dependency
        working-directory: DynamicDimensions
        env:
          PRE_RELEASE: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :Fabric:remapJar --stacktrace
          echo '--- DynamicDimensions Fabric jars ---'
          find Fabric/build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Wire recovered jars directly into Galacticraft
        working-directory: Galacticraft
        run: |
          MACHINE_JAR=$(find ../MachineLib/build/libs -maxdepth 1 -type f -name 'MachineLib-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | head -n 1)
          DD_JAR=$(find ../DynamicDimensions/Fabric/build/libs -maxdepth 1 -type f -name 'dynamicdimensions-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | head -n 1)

          test -n "$MACHINE_JAR"
          test -n "$DD_JAR"

          MACHINE_VERSION=$(basename "$MACHINE_JAR" .jar | sed 's/^MachineLib-//')
          DD_VERSION=$(basename "$DD_JAR" .jar | sed 's/^dynamicdimensions-fabric-//')

          echo "Recovered MachineLib: $MACHINE_JAR -> $MACHINE_VERSION"
          echo "Recovered DynamicDimensions: $DD_JAR -> $DD_VERSION"

          sed -i "s/^machinelib.version=.*/machinelib.version=${MACHINE_VERSION}/" gradle.properties
          sed -i "s/^dynamicdimensions.version=.*/dynamicdimensions.version=${DD_VERSION}/" gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle.kts')
          s = p.read_text()

          marker = 'repositories {'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('Could not find repositories block')
          insert_at = idx + len(marker)
          local_repo = '''\n    flatDir {\n        dirs("../MachineLib/build/libs", "../DynamicDimensions/Fabric/build/libs")\n    }'''
          s = s[:insert_at] + local_repo + s[insert_at:]

          # MachineLib's original Maven POM supplied this transitively. flatDir has no
          # POM metadata, so restore the exact dependency explicitly.
          dep_marker = 'dependencies {'
          dep_idx = s.find(dep_marker)
          if dep_idx < 0:
              raise SystemExit('Could not find dependencies block')
          dep_insert = dep_idx + len(dep_marker)
          energy_dep = '''\n    modImplementation("teamreborn:energy:3.0.0") {\n        isTransitive = false\n    }'''
          s = s[:dep_insert] + energy_dep + s[dep_insert:]

          p.write_text(s)
          PY

          echo '--- Effective recovered dependency versions ---'
          grep -E '^(dynamicdimensions|machinelib)\.version=' gradle.properties
          echo '--- Restored Reborn Energy dependency ---'
          grep -n -A3 'teamreborn:energy' build.gradle.kts

      - name: Compile recovered official Galacticraft 1.20.1
        working-directory: Galacticraft
        run: |
          chmod +x gradlew
          ./gradlew clean remapJar --stacktrace

      - name: Upload recovered Fabric baseline
        uses: actions/upload-artifact@v4
        with:
          name: Galacticraft-5-1.20.1-recovered-fabric-baseline
          path: Galacticraft/build/libs/*.jar
          if-no-files-found: error
