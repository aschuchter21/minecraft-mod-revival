name: Build Control Engineering 1.20.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-control-engineering.yml'
      - 'projects/control-engineering/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Control Engineering 1.20.1
        uses: actions/checkout@v4
        with:
          repository: malte0811/ControlEngineering
          ref: 1.20.1
          path: ControlEngineering

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Target Forge 47.4.10
        working-directory: ControlEngineering
        run: |
          sed -i 's/^forge_version=.*/forge_version=47.4.10/' gradle.properties
          echo '--- Effective gradle.properties ---'
          cat gradle.properties

      - name: Build Control Engineering
        working-directory: ControlEngineering
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: ControlEngineering-1.20.1-Forge47.4.10
          path: ControlEngineering/build/libs/*.jar
          if-no-files-found: error
