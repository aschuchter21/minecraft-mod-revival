plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group
version = mod_version

base {
    archivesName = 'Galacticraft-Forge-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        galacticraft {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// The assembled Galacticraft validation workspace supplies this jar. Declaring
// it through the mod-aware configuration is important: a plain runtimeOnly file
// makes MachineLib classes visible but does not make FML discover modId
// "machinelib", so Galacticraft's mandatory dependency fails before bootstrap.
dependencies {
    modRuntimeOnly files('libs/machinelib-forge-dev.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
