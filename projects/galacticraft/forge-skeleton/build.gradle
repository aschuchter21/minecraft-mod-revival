plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group
version = mod_version

base {
    archivesName = 'Galacticraft-Forge-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        galacticraft {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// The bare Forge skeleton is a separate CI build with no Galacticraft mixin
// sources; enabling the Mixin AP for it produces no refmap mapping file and
// causes reobfJar to fail. When the actual Forge overlays are copied into the
// full runtime project, the gear mixin exists and both dev and production
// remapping are enabled.
if (file('src/main/java/dev/galacticraft/forge/mixin/PlayerGearMixin.java').exists()) {
    mixin {
        add sourceSets.main, 'galacticraft.forge.refmap.json'
        config 'galacticraft.forge.mixins.json'
    }

    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }

    tasks.named('jar', Jar) {
        manifest.attributes([
            'MixinConfigs': 'galacticraft.forge.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
